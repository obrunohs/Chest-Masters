<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chest Masters - Jogo</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <section id="loginScreen" class="screen active">
    <div class="panel">
      <h1>Chest Masters</h1>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Senha">
      <button onclick="login()">Entrar no jogo</button>
      <button class="secondary" onclick="showScreen('registerScreen')">Cadastrar</button>
      <button class="secondary" onclick="recoverPassword()">Recuperar senha</button>
      <p class="small">Arquivo dos jogadores: index.html</p>
    </div>
  </section>

  <section id="registerScreen" class="screen">
    <div class="panel">
      <h2>Criar conta</h2>
      <input id="regName" placeholder="Nome do jogador">
      <input id="regEmail" type="email" placeholder="Email">
      <input id="regPassword" type="password" placeholder="Senha">
      <button onclick="registerAccount()">Cadastrar conta</button>
      <button class="secondary" onclick="showScreen('loginScreen')">Voltar</button>
      <p class="small">Depois de cadastrar, confirme o email para entrar.</p>
    </div>
  </section>

  <main id="game">
    <div id="hammerCursor">🔨</div>

    <div id="hud">
      <div class="hudBox">Jogador: <b id="hudName"></b></div>
      <div class="hudBox">Martelo: <b id="hudHammer"></b></div>
      <div class="hudBox">Cartas: <b id="hudCards"></b>/10</div>
      <div class="hudBox"><button class="danger" onclick="playerLogout()">Sair do jogo</button></div>
    </div>

    <section id="shopPanel">
      <h3>Loja</h3>
      <div id="shopItems"></div>
      <p class="small">Pix real será integrado depois com backend seguro.</p>
    </section>

    <section id="collectionPanel">
      <h3>Coleção</h3>
      <div id="cardsContainer"></div>
    </section>

    <div id="chest" onclick="hitChest()">
      <div id="chestEmoji">🧰</div>
      <div id="chestHealthBar"><div id="chestHealthFill"></div></div>
    </div>

    <div id="globalMessage"></div>
    <div id="toast"></div>
  </main>

  <script type="module" src="./js/game.js"></script>
</body>
</html>
